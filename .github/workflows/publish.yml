name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify without uploading
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" == "v$version" ]] || {
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          }
      - name: Package and verify
        run: cargo publish --locked --dry-run
      - name: Publish to crates.io
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crate_file=$(ls target/package/yolowzstd-*.crate | head -n 1)
          dir=$(dirname "$crate_file")
          name=$(basename "$crate_file")
          (cd "$dir" && sha256sum "$name" > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "yolowzstd ${GITHUB_REF_NAME}" \
            "$crate_file" \
            "$dir/SHA256SUMS.txt"
